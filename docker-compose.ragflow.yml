services:
  ragflow-backend:
    build:
      context: .
      dockerfile: docker/ragflow-backend.Dockerfile
    image: nexo-prototipe:ragflow-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
      - path: .env.compose.local
        required: false
    environment:
      RAGFLOW_HOST: 0.0.0.0
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_DBNAME: rag_flow
      ES_HOST: es01
      ES_USER: elastic
      MINIO_HOST: minio
      KVROCKS_HOST: kvrocks
      KVROCKS_PORT: 6379
      NATS_HOST: nats
      NATS_PORT: 4222
      INGESTOR_MAX_CONCURRENT_WORKERS: 1
    expose:
      - "9380"
      - "9381"
    depends_on:
      mysql:
        condition: service_healthy
      es01:
        condition: service_healthy
      minio:
        condition: service_healthy
      kvrocks:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - ragflow-logs:/ragflow/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9380/api/v1/system/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 4m
      retries: 8
    mem_limit: 1536m

  mysql:
    image: mysql:8.0.40
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
      - path: .env.compose.local
        required: false
    command:
      - --max_connections=400
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --init-file=/data/application/init.sql
      - --innodb-buffer-pool-size=512M
      - --innodb-redo-log-capacity=512M
    volumes:
      - mysql-data:/var/lib/mysql
      - ./vendor/ragflow/docker/init.sql:/data/application/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 768m

  es01:
    image: elasticsearch:8.11.3
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
      - path: .env.compose.local
        required: false
    environment:
      node.name: es01
      bootstrap.memory_lock: "false"
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.routing.allocation.disk.watermark.low: 5gb
      cluster.routing.allocation.disk.watermark.high: 3gb
      cluster.routing.allocation.disk.watermark.flood_stage: 2gb
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    mem_limit: 1536m

  minio:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    restart: unless-stopped
    command: ["server", "--console-address", ":9001", "/data"]
    env_file:
      - path: .env
        required: true
      - path: .env.compose.local
        required: false
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 384m

  kvrocks:
    image: apache/kvrocks:2.16.0
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["/bin/sh", "/etc/kvrocks/entrypoint.sh"]
    env_file:
      - path: .env
        required: true
      - path: .env.compose.local
        required: false
    volumes:
      - kvrocks-data:/var/lib/kvrocks
      - ./vendor/ragflow/docker/kvrocks-entrypoint.sh:/etc/kvrocks/entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 128m

  nats:
    image: nats:2.14.2
    restart: unless-stopped
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "nats-server", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 128m

volumes:
  ragflow-logs:
  mysql-data:
  elasticsearch-data:
  minio-data:
  kvrocks-data:
  nats-data:
