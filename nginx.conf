server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = / {
    proxy_pass http://nexo-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
  }

  location = /admin {
    return 302 /nexo-prototipo.html?vista=configuration;
  }

  location = /admin/ {
    return 302 /nexo-prototipo.html?vista=configuration;
  }

  location = /admin.html {
    return 302 /nexo-prototipo.html?vista=configuration;
  }

  location ~ ^/(connection-settings|shell-controls)\.js$ {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }

  location = /nexo-prototipo.html {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }

  location = /nexo-ragflow.js {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }

  location = /workspace.js {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }

  location ~ ^/(nexo-live|assistant|document-upload|document-table|provider|provider-icons|provider-modal|data-source-icons|data-source-modal|workspace-modal|workspace-modals)\.(js|css)$ {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }

  location = /workspace.html {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
  }

  location ^~ /api/ {
    proxy_pass http://nexo-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri =404;
  }
}
